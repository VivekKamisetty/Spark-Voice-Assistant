<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spark</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
</head>
<body>
  <div id="app">
    <div id="orb-wrap">
      <canvas id="orb-canvas"></canvas>
      <button id="stop-button" class="hidden" title="Stop Spark">✕</button>
    </div>

    <div id="panel">
      <div id="panel-header">
        <button id="hide-panel-button" title="Hide">︿</button>
      </div>
      <div id="transcript-scroll">
        <div id="transcript"></div>
        <div id="tool-activity" class="hidden"></div>
      </div>

      <div id="confirmation-chips" class="hidden"></div>

      <div id="input-row">
        <input id="text-input" type="text" placeholder="Type a message…" autocomplete="off" />
        <button id="copy-last-button" title="Copy Spark's last reply">Copy</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
